<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="가족관계 주차별 학습 자료실. 원문 내용, 한글 해석, 내용 요약, 퀴즈를 함께 읽습니다.">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>가족관계 | 주차별 학습 자료실</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23173f35'/%3E%3Cpath d='M17 15h30v37L32 43l-15 9z' fill='none' stroke='%23eee9d7' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 바로 가기</a>
  <div id="shell" class="shell">
    <aside id="sidebar" class="sidebar" aria-label="자료실 탐색"></aside>
    <div class="workspace">
      <header id="topbar" class="topbar"></header>
      <main id="main" class="main" tabindex="-1"><div class="loading" role="status">자료를 불러오고 있습니다.</div></main>
      <footer id="footer" class="footer"></footer>
    </div>
  </div>
  <button id="scrim" class="mobile-scrim" data-action="close-menu" aria-label="탐색 메뉴 닫기"></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="image-dialog" class="image-dialog" aria-labelledby="zoom-title"><div class="dialog-toolbar"><strong id="zoom-title">원본 슬라이드</strong><button class="button small" data-action="close-zoom">닫기 ✕</button></div><img id="zoom-image" alt="확대한 원본 슬라이드"></dialog>
  <noscript>자료실의 탭과 퀴즈를 사용하려면 JavaScript를 허용해 주세요. 원본 PDF는 assets/source 폴더에 있습니다.</noscript>
  <script src="data/catalog.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
